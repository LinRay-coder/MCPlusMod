# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.15.5

# Mod Properties
# mod_version 现在只写纯 mod 版本号（x.x.x）。
# 第1位=重大改变（如新方块），第2位=新 ModLoader/API 适配，第3位=修 bug。
# 最终 jar 名由 build.gradle 拼成 MCPlusMod-<MC版本>-Fabric-<mod版本>.jar
mod_version=1.0.0
maven_group=com.example.mcplusmod
archives_base_name=MCPlusMod

# Dependencies
fabric_api_version=0.155.2+26.1.2
